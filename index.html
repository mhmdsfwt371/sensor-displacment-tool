/* ================= دليل الاستخدام | User manual ================= */
function manualHTML(){
  if(L==="en")return `
<h3>1. What this tool does</h3>
<p>It turns a floor plan into a sensor and gateway layout, and produces everything three
departments need from one file: a drawing image for <b>sales</b> to attach to a quote, an
installation schedule for <b>operations</b>, and a permanent device map for <b>after-sales</b>.</p>
<blockquote>Standards applied: one sensor per <b>25 m²</b> (adjustable) and one
<b>independent gateway per room</b>. Both are set in section 4.</blockquote>

<h3>2. Installing the tool on your device</h3>
<p>It installs like any app, opens from an icon, and runs <b>offline</b> after the first visit —
useful inside stores and cold rooms where signal is weak.</p>
<table><tr><th>Device</th><th>Steps</th></tr>
<tr><td><b>Android</b></td><td>Open the link in Chrome, then tap the green <b>Install</b> button
at the top, or <i>Install app</i> from the browser menu.</td></tr>
<tr><td><b>iPhone / iPad</b></td><td>Open the link in <b>Safari</b>, tap Share, then
<i>Add to Home Screen</i>. (Safari has no one-tap install like Chrome.)</td></tr>
<tr><td><b>Windows</b></td><td>Open in Chrome or Edge, use the install icon in the address bar
or the <b>Install</b> button. It lands in the Start menu like any program.</td></tr></table>
<blockquote>Once installed it still updates itself from the web — installing does not freeze it
on one version.</blockquote>
<h4>Theme</h4>
<p>The <b>◐</b> button switches between <b>dark</b> and <b>light</b>. Light reads better in
daylight on site, dark is easier on the eyes at a desk. Your choice is saved on the device.</p>

<h3>3. Getting the plan in — three ways</h3>
<h4>A. Image</h4>
<p>Upload a photo or scan of the plan. If the lines are faint, press <b>To line art</b> and
adjust <b>Cleanup strength</b> until walls read clearly. The plan stays an image — the tool
detects rooms from it but cannot know real distances until you set the scale.</p>
<h4>B. Dimensions</h4>
<p>Type a room name, length and width in metres, then <b>Add Room</b>. Rooms are laid out
side by side automatically. Best when you have a measurement sheet but no drawing.</p>
<h4>C. Description — fastest</h4>
<p>Write in plain language and press <b>Draw Plan</b>:</p>
<p><code>warehouse 100 sqm with two rooms, one 4x5 and one 4x6</code></p>
<p>The tool reads it, draws walls and doors to exact scale, names rooms from words it
recognises (cold, medicine, office, corridor…), and if the rooms total less than the stated
area it adds a <b>Remaining area</b> block so counts cover the whole building.</p>
<p>A line reading <b>Understood:</b> appears under the box. Read it before you continue —
it is your check that the tool got your intent.</p>
<p>For exact control, use the precise syntax instead:</p>
<table><tr><th>Line</th><th>Meaning</th></tr>
<tr><td><code>room "Store" 0,0 12x8</code></td><td>corner at 0,0 then 12 × 8 m</td></tr>
<tr><td><code>poly "Name" 0,0 6,0 6,4 0,4</code></td><td>non-rectangular shape</td></tr>
<tr><td><code>door 5,8 6,8</code></td><td>door between two points</td></tr>
<tr><td><code>wall 3,0 3,8</code></td><td>internal wall</td></tr></table>

<h3>4. Run Everything</h3>
<p>One button does the whole chain: detect rooms → measure → place sensors → place gateways.
It asks a single question — <b>how many metres across is the plan</b> — because no image
carries real-world distance. A rough number works; refine later with the <b>Scale</b> tool.</p>
<p>If you drew the plan from a description or dimensions, the scale is already exact and the
question is skipped.</p>

<h3>5. Zone types — room, corridor, fridge</h3>
<p>In the toolbar, next to <b>Rectangle</b> and <b>Polygon</b>, there is a three-button picker:
<b>Room · Corridor · Fridge</b>. Whatever is selected becomes the type of the next zone you draw.
You can also change any existing zone's type from the small dropdown on its card in the
<b>Rooms</b> section. The type changes both how counts are calculated and how it is drawn:</p>
<table><tr><th>Type</th><th>Counting</th><th>On the plan</th></tr>
<tr><td><b>Room</b></td><td>One sensor per 25 m² of its net area</td><td>Full-thickness walls</td></tr>
<tr><td><b>Corridor</b></td><td><b>Zero</b> sensors by default — it is not storage space</td>
<td>Dashed grey outline, no walls</td></tr>
<tr><td><b>Fridge</b></td><td>At least one sensor, more as it grows</td><td>Cyan frame, thinner wall</td></tr></table>
<blockquote><b>Net area:</b> fridges placed inside a room have their area subtracted from the
room before its sensors are counted, and room sensors are kept out of the fridge footprint —
so nothing is double-counted and no sensor lands in the wrong place.</blockquote>
<p>You can also write them straight into the <b>Description</b>:</p>
<p><code>room cold 6x5</code> · <code>corridor 12x2</code> · <code>fridge 2x1.5</code></p>
<p>If a corridor does need monitoring, just raise its count with <b>+</b>.</p>
<blockquote>Press <b>Load sample</b> in the Drawing section to see all three types together: two
stores, a corridor between them, and three fridges inside.</blockquote>

<h3>6. Reviewing and adjusting — your main job</h3>
<p>The tool goes first, you validate. Every room in section 3 has:</p>
<ul>
<li><b>+ and −</b> — change that room's sensor count; the tool immediately redistributes them
evenly inside the room</li>
<li><b>Back to auto</b> — appears once you have overridden a count, so you can always see
which rooms you touched</li>
</ul>
<blockquote>Your manual counts survive redistribution. Pressing <b>Distribute</b> again
recalculates only the rooms still on Auto.</blockquote>
<p>Section 6, <b>Pre-Handover Check</b>, lists anything that needs a decision: rooms with no
sensors, counts below standard, missing gateways, sensors beyond gateway range, sensors
outside every room, and any room where your manual count differs from the standard.</p>

<h3>7. Drawing and editing tools</h3>
<table><tr><th>Tool</th><th>Use</th></tr>
<tr><td><b>Edit</b></td><td>Default. Drag sensors, gateways, room corners, walls and doors.
Drag empty space to pan.</td></tr>
<tr><td><b>Pan</b></td><td>Move the view only — nothing can be moved by accident.</td></tr>
<tr><td><b>Scale</b></td><td>Click two points on a known distance, type it in metres.</td></tr>
<tr><td><b>Polygon</b></td><td>Click corner by corner. Click the first point again, or press
<span class="kbd">Enter</span>, to close.</td></tr>
<tr><td><b>Rectangle</b></td><td>Drag. Live dimensions show while you drag.</td></tr>
<tr><td><b>Magic Room</b></td><td>Click inside any room on an image and it traces the walls.</td></tr>
<tr><td><b>Wall</b></td><td>Click point to point. Click the last point again to end the chain.</td></tr>
<tr><td><b>Door</b></td><td>Click any wall — a 90 cm door with a swing arc is placed. Click it
again to flip the swing.</td></tr>
<tr><td><b>Sensor / Gateway</b></td><td>Click to add, click an existing one to remove.</td></tr>
</table>
<h4>Drawing aids</h4>
<ul>
<li><b>Angle lock</b> — lines near horizontal or vertical snap flat. Hold
<span class="kbd">Shift</span> for a free angle.</li>
<li><b>Alignment guides</b> — a green line appears when you line up with an existing corner.</li>
<li><b>Half-metre grid</b> and snapping to existing corners.</li>
<li><b>Live lengths</b> on every wall and room edge, updating as you drag.</li>
</ul>
<h4>Selecting and deleting</h4>
<p>In <b>Edit</b>, click something to select it — a red <b>✕</b> appears next to it. Click the
✕ or press <span class="kbd">Delete</span> to remove it.</p>
<blockquote>A room moves only after it is selected: the first click selects, the second drags.
This keeps you from nudging a room while panning.</blockquote>
<p>A sensor dropped outside every room returns to the nearest point inside its own room.
A sensor dropped inside a different room is reassigned to that room's gateway and renumbered.</p>

<h3>8. Undo and redo</h3>
<p>Two floating buttons sit at the bottom of the drawing: <b>↶</b> undo and <b>↷</b> redo,
covering the last 40 actions. Keyboard: <span class="kbd">Ctrl</span> +
<span class="kbd">Z</span> and <span class="kbd">Ctrl</span> + <span class="kbd">Shift</span> +
<span class="kbd">Z</span>.</p>

<h3>9. Gateways — a checkpoint with a range</h3>
<p>A gateway is a <b>collection point</b>, not a device bound to particular sensors. Any sensor
inside its range reaches it. That is why no link lines are drawn — what you see is the dashed
<b>range circle</b> around it, and every sensor inside is covered.</p>
<p>Section 4 holds the <b>Gateway policy</b> with three modes:</p>
<table><tr><th>Mode</th><th>Behaviour</th></tr>
<tr><td><b>One per room</b></td><td>Default. One gateway for every room that has sensors —
<b>range is not a criterion here</b>. Even if a single gateway could cover the whole building,
each room still gets its own, because the requirement is network isolation, not signal reach.</td></tr>
<tr><td><b>Group by range</b></td><td>Fewest gateways that cover every sensor, ignoring rooms.</td></tr>
<tr><td><b>Manual</b></td><td>Nothing is placed automatically — you place them.</td></tr></table>
<p><b>A fridge follows its room.</b> A fridge inside a room does not get its own gateway — its
sensors belong to the room's gateway, and the gateway position accounts for the fridge sensors
too. A standalone fridge with no room around it is treated as a room and gets its own.</p>
<p><b>A gateway you place by hand</b> counts for one room only: <b>the room it sits inside</b>.
Put it on the wall between two rooms and it counts for neither — both rooms get their own and
yours remains extra. The <b>Pre-Handover Check</b> flags it: “gateway not inside any room”.</p>
<h4>A gateway between two rooms</h4>
<p>Pick the <b>Gateway</b> tool and place it on the wall between the rooms. Every sensor within
range in either room is covered — no manual linking involved.</p>
<blockquote>A gateway you place by hand is <b>fixed</b>: redistribution never removes it, and the
tool only adds gateways for rooms whose sensors are still out of range.</blockquote>
<h4>Power</h4>
<p>Every gateway is drawn with an <b>orange power symbol</b> beside it — a marker that the spot
needs a power source. It appears on every output and in the symbol key, so operations can see
where to run power straight from the drawing, before going on site.</p>
<blockquote>This is why gateways often sit in the <b>corridor</b>: power is available there, while
the sensors stay inside the fridges and rooms within its range.</blockquote>
<h4>On the plan</h4>
<ul>
<li>The <b>Gateway range</b> button in the toolbar shows or hides the range circles.</li>
<li><b>Client version</b> hides both coverage and range circles — the client sees symbols and
positions only, with no lines inviting "why is this one wired to that one?"</li>
</ul>
<p>The <b>Pre-Handover Check</b> reports any sensor beyond the nearest gateway, with the distance
in metres, and any room without a gateway inside it when the policy is one-per-room.</p>

<h3>10. Company standards</h3>
<p>Section 4 holds every rule the counts depend on: sensor coverage, minimum per room, gateway
type and range, one-gateway-per-room, symbol size on the drawing, and accessories per unit
(batteries, mounts, adapters) with a spare percentage. Change a value and every count, table
and output updates immediately.</p>
<p><b>Symbol size</b> is measured in metres on the drawing once a <b>scale</b> is set. Before
calibration the slider still grows and shrinks the symbols on screen, so they stay visible while
you draw — you do not have to calibrate first just to see your work.</p>

<h3>11. Outputs — and who each one is for</h3>
<p><b>The AFAQY brand is fixed.</b> There is no logo picker and no way to change or remove it.
The logo is placed automatically on the drawing sheet header and on every print sheet, with the
company name and website in the footer. The tool fetches it from the official website once and
keeps it in the browser, so it works offline afterwards. If it cannot be reached for any reason,

<h3>٣. إدخال الرسمة — تلات طرق</h3>
<h4>أ. صورة</h4>
<p>ارفع صورة أو مسح ضوئي للرسمة. لو الخطوط باهتة، دوس <b>تحويل لخطوط</b> وظبّط
<b>درجة التنقية</b> لحد ما الحوائط تبان واضحة. الرسمة بتفضل <b>صورة</b> — الأداة بتكتشف الغرف
منها بس مش هتعرف المسافات الحقيقية غير لما تحدد المقياس.</p>
<h4>ب. أبعاد</h4>
<p>اكتب اسم الغرفة وطولها وعرضها بالمتر ودوس <b>إضافة الغرفة</b>. الغرف بتترص جنب بعض
تلقائيًا. مناسبة لما يكون معاك كشف مقاسات من غير رسمة.</p>
<h4>ج. وصف مكتوب — الأسرع</h4>
<p>اكتب بكلامك العادي ودوس <b>ارسم المخطط</b>:</p>
<p><code>مستودع ١٠٠ متر مربع فيه غرفتين واحدة ٤×٥ والتانية ٤×٦</code></p>
<p>الأداة تقرا وترسم الحوائط والأبواب بمقياس مضبوط، وتسمّي الغرف من الكلمات اللي تعرفها
(تبريد، أدوية، مكتب، ممر…)، ولو مجموع الغرف أقل من المساحة المكتوبة بتضيف منطقة
<b>المساحة المتبقية</b> عشان الأعداد تغطي المبنى كله.</p>
<p>تحت الخانة بيظهر سطر <b>اللي فهمته:</b> — اقراه قبل ما تكمّل، ده ضمانك إن الأداة فهمت قصدك.</p>
<p>وللتحكم الدقيق استعمل الصيغة المضبوطة:</p>
<table><tr><th>السطر</th><th>المعنى</th></tr>
<tr><td><code>غرفة "مخزن" 0,0 12x8</code></td><td>الركن عند 0,0 ثم ١٢ × ٨ م</td></tr>
<tr><td><code>مضلع "الاسم" 0,0 6,0 6,4 0,4</code></td><td>شكل غير مستطيل</td></tr>
<tr><td><code>باب 5,8 6,8</code></td><td>باب بين نقطتين</td></tr>
<tr><td><code>حائط 3,0 3,8</code></td><td>حائط داخلي</td></tr></table>

<h3>٤. شغّل كل حاجة</h3>
<p>زر واحد بيعمل السلسلة كلها: يكتشف الغرف ← يحسب المساحات ← يوزّع الحساسات ← يحط الجيت واي.
وبيسأل سؤال واحد بس — <b>الرسمة كلها كام متر</b> — لأن مفيش صورة بتحمل معلومة المسافة الحقيقية.
رقم تقريبي يكفي، وتظبطه بعدين بأداة <b>معايرة</b>.</p>
<p>ولو رسمت من وصف أو أبعاد، المقياس بيبقى مضبوط أصلًا والسؤال بيتخطّى.</p>

<h3>٥. أنواع المناطق — غرفة وممر وثلاجة</h3>
<p>في شريط الأدوات فوق، جنب <b>مستطيل</b> و<b>مضلع</b>، فيه محدد بتلات أزرار:
<b>غرفة · ممر · ثلاجة</b>. اللي مختاره هو نوع أي منطقة ترسمها بعد كده. وتقدر تغيّر نوع أي
منطقة موجودة من القايمة الصغيرة في بطاقتها في قسم <b>الغرف</b>. والنوع بيغيّر حساب الأعداد
وشكل الرسم:</p>
<table><tr><th>النوع</th><th>الأعداد</th><th>على الرسمة</th></tr>
<tr><td><b>غرفة</b></td><td>حساس لكل ٢٥ م٢ من مساحتها الصافية</td><td>حوائط بسُمك كامل</td></tr>
<tr><td><b>ممر</b></td><td><b>صفر</b> حساسات افتراضيًا — الممر مش مساحة تخزين</td>
<td>حدود متقطعة رمادية من غير حوائط</td></tr>
<tr><td><b>ثلاجة</b></td><td>حساس على الأقل، بيزيد بمساحتها</td><td>إطار سماوي بحائط أرفع</td></tr></table>
<blockquote><b>مساحة صافية:</b> لو حطيت ثلاجات جوّه غرفة، الأداة بتطرح مساحتهم من مساحة
الغرفة قبل ما تحسب حساساتها، وبتمنع حساسات الغرفة إنها تقع جوّه الثلاجة. فمفيش عدّ مزدوج
ومفيش حساس في المكان الغلط.</blockquote>
<p>وتقدر تكتبهم في <b>الوصف المكتوب</b> على طول:</p>
<p><code>غرفة تبريد 6x5</code> · <code>ممر 12x2</code> · <code>ثلاجة 2x1.5</code></p>
<p>ولو عايز الممر يتراقب فعلًا، زوّد عدده بزر <b>+</b> عادي.</p>
<blockquote>دوس <b>مثال جاهز</b> في قسم الرسمة وهتشوف الأنواع التلاتة مع بعض: غرفتين، وممر
بينهم، وتلات ثلاجات جوّه المخازن.</blockquote>

<h3>٦. المراجعة والتعديل — دورك الأساسي</h3>
<p>الأداة تشتغل الأول وإنت تراجع. كل غرفة في قسم ٣ عليها:</p>
<ul>
<li><b>+ و −</b> — تغيّر عدد حساسات الغرفة، والأداة تعيد توزيعهم متوازنين جوّاها فورًا</li>
<li><b>رجّع للتلقائي</b> — بيظهر بعد ما تعدّل العدد بإيدك، عشان تعرف دايمًا إنت لمست أنهي غرف</li>
</ul>
<blockquote>أعدادك اليدوية مبتضيعش. لما تدوس <b>وزّع</b> تاني، الأداة بتعيد حساب الغرف اللي
لسه على <b>تلقائي</b> بس.</blockquote>
<p>قسم ٦ <b>فحص قبل التسليم</b> بيسرد أي حاجة محتاجة قرار: غرف من غير حساسات، أعداد أقل من
المعيار، جيت واي ناقص، حساس خارج مدى الجيت واي، حساس برة كل الغرف، وأي غرفة عددك اليدوي فيها
مختلف عن المعيار.</p>

ومن الكيبورد: <span class="kbd">Ctrl</span> + <span class="kbd">Z</span> و
<span class="kbd">Ctrl</span> + <span class="kbd">Shift</span> + <span class="kbd">Z</span>.</p>

<h3>٩. الجيت واي — تشيك بوينت بمدى</h3>
<p>الجيت واي <b>نقطة تجميع</b>، مش جهاز مربوط بحساسات معيّنة. أي حساس جوّه مداه بيوصله.
عشان كده مفيش خطوط ربط على الرسمة — اللي بيظهر هو <b>دايرة المدى</b> المتقطعة حواليه،
وأي حساس جوّاها مغطّى.</p>
<p>قسم ٤ فيه <b>سياسة الجيت واي</b> بتلات أوضاع:</p>
<table><tr><th>الوضع</th><th>بيعمل إيه</th></tr>
<tr><td><b>مستقل لكل غرفة</b></td><td>الافتراضي. جيت واي لكل غرفة فيها حساسات — <b>المدى
مش معيار هنا</b>. حتى لو جيت واي واحد بمداه يغطي المبنى كله، كل غرفة بتاخد بتاعها لأن
المطلوب فصل الشبكات مش تغطية الإشارة.</td></tr>
<tr><td><b>تجميع حسب المدى</b></td><td>أقل عدد جيت واي يغطي كل الحساسات، من غير نظر للغرف.</td></tr>
<tr><td><b>يدوي</b></td><td>الأداة مبتحطش حاجة — إنت اللي بتحط.</td></tr></table>
<p><b>الثلاجة تابعة للغرفة.</b> الثلاجة اللي جوّه غرفة مبتاخدش جيت واي لوحدها — حساساتها
بتتبع جيت واي الغرفة، وموقع الجيت واي بيتحسب وهو حاطط حساسات الثلاجات في الحسبان.
الثلاجة اللي واقفة لوحدها من غير غرفة حواليها بتتعامل كغرفة وتاخد بتاعها.</p>
<p><b>والجيت واي اللي بتحطه بإيدك</b> بيتحسب لغرفة واحدة بس: <b>الغرفة اللي هو جوّاها</b>.
لو حطيته على الحيطة بين غرفتين، مش بيعتبر جيت واي لأي واحدة فيهم — الغرفتين هياخدوا
بتوعهم، وهو بيفضل زيادة. و<b>الفحص قبل التسليم</b> بينبهك: «جيت واي مش جوّه أي غرفة».</p>
<h4>جيت واي بين غرفتين</h4>
<p>اختار أداة <b>جيت واي</b> وحطه على الحيطة بين الغرفتين. كل حساس جوّه مداه في الغرفتين
بيبقى مغطّى — من غير أي ربط يدوي.</p>
<blockquote>الجيت واي اللي بتحطه بإيدك <b>ثابت</b>: مبيتمسحش لما تدوس <b>وزّع</b> تاني،
والأداة بتحط جيت واي إضافي بس للغرف اللي لسه حساساتها برة أي مدى.</blockquote>
<h4>الكهرباء</h4>
<p>كل جيت واي بيتحط جنبه <b>رمز كهرباء برتقالي</b> تلقائيًا — علامة إن المكان ده محتاج
مصدر كهرباء. الرمز بيظهر على كل المخرجات ومكتوب في مفتاح الرموز، فالأوبريشن بيعرف من الرسمة
نفسها هيمد الكهرباء فين قبل ما ينزل الموقع.</p>
<blockquote>عشان كده كتير بيتحط الجيت واي في <b>الممر</b>: الكهرباء متوفرة هناك، والحساسات
تفضل جوّه الثلاجات والغرف في مداه.</blockquote>
<h4>على الرسمة</h4>
<ul>
<li>زر <b>مدى الجيت واي</b> في شريط الأدوات بيظهر أو يخفي دواير المدى.</li>
<li><b>نسخة العميل</b> بتخفي دواير التغطية والمدى — العميل بيشوف الرموز ومكانها بس،
من غير أي خطوط تخليه يسأل «اشمعنى ده متوصل بده».</li>
</ul>
<p><b>فحص قبل التسليم</b> بينبهك على أي حساس خارج مدى أقرب جيت واي وبالمسافة بالمتر،
وعلى أي غرفة من غير جيت واي جوّاها لو السياسة «مستقل لكل غرفة».</p>

<h3>١٠. معايير الشركة</h3>
<p>قسم ٤ فيه كل قاعدة الأعداد بتعتمد عليها: تغطية الحساس، أقل عدد للغرفة، نوع الجيت واي ومداه،
جيت واي مستقل لكل غرفة، حجم الرمز على الرسمة، والمستلزمات لكل وحدة (بطاريات، قواعد، محولات)
مع نسبة احتياطي. غيّر أي قيمة وكل الأعداد والجداول والمخرجات تتحدث على طول.</p>
<p><b>حجم الرمز</b> بيتقاس بالمتر على الرسمة لما يكون فيه <b>مقياس</b>. ولو الرسمة لسه مش
معايرة، الشريط بيكبّر ويصغّر الرموز على الشاشة على طول عشان تفضل باينة وإنت بترسم — يعني
مش مستني المعايرة عشان تشوف شغلك.</p>

<h3>١١. المخرجات — وكل واحد لمين</h3>
<p><b>هوية آفاقي ثابتة.</b> مفيش زر يختار الشعار ومحدش يقدر يغيّره أو يشيله. الشعار بيتحط
تلقائي على ترويسة صورة العرض وعلى كل ورقة طباعة، واسم الشركة والموقع في التذييل. الأداة
بتجيب الشعار من الموقع الرسمي أول مرة وبتخزّنه في المتصفح، فبعد كده بيشتغل من غير نت. ولو
ملحقش يوصل لأي سبب، بيتكتب <b>AFAQY</b> بالخط مكانه — يعني مخرَج عمره ما يطلع من غير هوية.</p>
<table><tr><th>المخرَج</th><th>لمين</th></tr>
<tr><td><b>صورة الرسمة</b></td><td>المبيعات — ورقة كاملة باسم المشروع والشركة ورقم AUX
والتاريخ والشعار والرسمة ومفتاح الرموز والأعداد. تتبعت مع عرض السعر.</td></tr>
<tr><td><b>ملف PDF</b></td><td>نفس الورقة بالظبط في ملف <code>.pdf</code> جاهز للطباعة أو
الإرسال، وبينزل على طول من غير ما تعدّي على نافذة الطباعة.</td></tr>
<tr><td><b>جدول الأعداد</b></td><td>ملف جدول: كل غرفة بمساحتها وعدد حساساتها وجيت واي
وأبعد حساس، وتحته الإجمالي وقائمة التوريد بنسبة الاحتياطي.</td></tr>
<tr><td><b>ملخص المبيعات</b></td><td>بيتنسخ نص جاهز تلزقه في رسالة.</td></tr>
<tr><td><b>نسخة العميل</b></td><td>علّم عليها عشان تخفي دوائر التغطية وخطوط الوصل ويطلع رسم
أنضف للعميل.</td></tr></table>

<p><b>المخرَج بيرجع يتفتح ويتعدّل.</b> الصورة وملف <code>.pdf</code> جوّاهم المشروع كله متخزّن —
الرسمة والغرف والتوزيع والمعايير واللغة. نزّل الملف وابعته عادي، ولما تحب تعدّل بعد شهر دوس
<b>افتح مخرَج للتعديل</b> وارفع نفس الملف: بيرجع مفتوح زي ما سبته بالظبط، تعدّل وتنزّله تاني.
وتقدر تسحب الملف على الرسمة على طول. وزر <b>فتح</b> فوق بيقبل الاتنين وملف
<code>.json</code> كمان.</p>
<p><b>خد بالك:</b> لو الصورة عدّت على واتساب أو أي حاجة بتعيد ضغط الصور، البيانات اللي جوّاها
بتضيع وتفضل صورة عادية. ابعتها <b>كمرفق</b>. وملف <code>.pdf</code> مبيتأثرش بده.</p>

<h3>١٢. الحفظ والمشاركة</h3>
<ul>
<li><b>حفظ تلقائي صامت</b> — شغلك بيتحفظ في المتصفح ده مع كل تعديل، من غير أي رسايل تقطع
عليك. و<b>الريفريش بيبدأ نضيف</b> زي ما هو متوقع. لو احتجت ترجّع آخر شغل، هتلاقي زر
<b>استرجاع آخر شغل</b> جوّه قسم <b>بيانات المشروع</b> ومكتوب جنبه من إمتى — بيظهر بس لو فيه
فعلًا شغل محفوظ. ده لكل جهاز لوحده — مش نسخة احتياطية.</li>
<li><b>حفظ / فتح</b> — ملف <code>.json</code> فيه كل حاجة: الرسمة والغرف والتوزيع والمعايير
واللغة. ابعته لزميلك يكمّل من نفس النقطة بالظبط. وتقدر تسحب الملف على الرسمة عشان
تفتحه.</li>
<li><b>السحابة</b> — لما يكون الدخول متظبط، بيظهر <b>حفظ للسحابة</b> و<b>فتح من السحابة</b>،
والقائمة بتوضّح مين آخر واحد حفظ كل مشروع وإمتى.</li>
</ul>
<blockquote>لو اتنين حفظوا نفس مشروع السحابة في نفس اللحظة، آخر واحد حفظ هو اللي يثبت. بص على
القايمة وشوف مين عدّل آخر مرة قبل ما تكتب فوقه.</blockquote>

let FBX=null;
async function initFB(){
  if(!FIREBASE.apiKey){gate.classList.remove("on");return;}
  gate.classList.add("on");
  try{
    const [a,b,c]=await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")]);
    const app=a.initializeApp(FIREBASE);
    FBX={a,b,c,auth:b.getAuth(app),db:c.getFirestore(app),user:null};
    b.onAuthStateChanged(FBX.auth,u=>{
      FBX.user=u||null;
      if(u){gate.classList.remove("on");userChip.textContent=u.email;
        btnLogout.style.display="inline-block";cloudBox.style.display="block";}
      else{gate.classList.add("on");userChip.textContent="";
        btnLogout.style.display="none";cloudBox.style.display="none";}});
  }catch(e){gErr.textContent=t("aNoCloud");}}
function reshrink(dataUrl,max,q){
  return new Promise(res=>{const im=new Image();
    im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement("canvas");
      c.width=Math.max(2,Math.round(im.width*s));c.height=Math.max(2,Math.round(im.height*s));
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",q));};
    im.onerror=()=>res(dataUrl);im.src=dataUrl;});}
async function cloudSave(){
  if(!FBX||!FBX.user){alert(t("aNoCloud"));return;}
  syncCfg();P.lang=L;
  const copy=JSON.parse(JSON.stringify(P));
  for(const q of copy.plans)if(q.imgData)q.imgData=await reshrink(q.imgData,1200,.68);
  const s=JSON.stringify(copy);
  if(s.length>950000){alert(t("aTooBig"));return;}
  const id=P.cloudId||("p"+Date.now()+Math.floor(Math.random()*997));
  try{
    await FBX.c.setDoc(FBX.c.doc(FBX.db,"projects",id),{
      uid:FBX.user.uid,by:FBX.user.email,name:P.name||"",ref:P.ref||"",client:P.client||"",
      updated:Date.now(),data:s});
    P.cloudId=id;toast(t("tCloudSaved"));
  }catch(e){alert(t("aNoCloud"));}}
async function cloudList(){
  if(!FBX||!FBX.user){alert(t("aNoCloud"));return;}
  const el=document.getElementById("cloudList");el.innerHTML="";
  try{
    const res=await FBX.c.getDocs(FBX.c.collection(FBX.db,"projects"));
    const arr=[];res.forEach(d=>arr.push(Object.assign({id:d.id},d.data())));
    arr.sort((x,y)=>(y.updated||0)-(x.updated||0));
    if(!arr.length){el.innerHTML='<div class="issue">'+t("cloudEmpty")+'</div>';return;}
    arr.slice(0,30).forEach(o=>{
      const d=document.createElement("div");d.className="item";
      d.innerHTML='<span class="go">'+esc(o.name||"—")+(o.ref?" · "+esc(o.ref):"")+
        '<br><span class="meta">'+esc(o.by||"")+' · '+
        new Date(o.updated||0).toLocaleDateString(L==="ar"?"ar-EG":"en-GB")+'</span></span>'+
        '<button class="op">'+t("bOpen")+'</button>';
      d.querySelector(".op").onclick=()=>{
        try{applyProject(JSON.parse(o.data));P.cloudId=o.id;toast(t("tOpened"));}
        catch(e){alert(t("aFile"));}};
      el.appendChild(d);});
  }catch(e){alert(t("aNoCloud"));}}

/* ===== شارت زمني لغرفة → صورة ===== */
function hmChart(list,tr,w,h){
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const g=c.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,w,h);
  if(!list.length)return c;
  const padL=46,padR=14,padT=16,padB=34,W=w-padL-padR,H=h-padT-padB;
  const t0=list[0].t,t1=list[list.length-1].t||t0+1;
  const cs=list.map(o=>o.c),hs=list.filter(o=>o.h!=null).map(o=>o.h);
  let lo=Math.min.apply(null,cs.concat([tr.t0])),hi=Math.max.apply(null,cs.concat([tr.t1]));
  if(hs.length){lo=Math.min(lo,0);hi=Math.max(hi,100);}
  lo=Math.floor(lo-2);hi=Math.ceil(hi+2);
  const X=t=>padL+W*(t-t0)/Math.max(1,t1-t0),Y=v=>padT+H*(1-(v-lo)/(hi-lo));
  g.strokeStyle="#e3e8ee";g.lineWidth=1;g.fillStyle="#7b8794";
  g.font='10px "Segoe UI",Tahoma,sans-serif';g.textAlign="right";
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);
    g.beginPath();g.moveTo(padL,y);g.lineTo(w-padR,y);g.stroke();
    g.fillText(Math.round(v),padL-6,y+3);}
  /* نطاق المدى المسموح */
  g.fillStyle="rgba(34,165,95,.10)";
  g.fillRect(padL,Y(tr.t1),W,Y(tr.t0)-Y(tr.t1));
  g.strokeStyle="#22a55f";g.setLineDash([5,4]);
  [tr.t0,tr.t1].forEach(v=>{g.beginPath();g.moveTo(padL,Y(v));g.lineTo(w-padR,Y(v));g.stroke();});
  g.setLineDash([]);
  const line=(pick,col)=>{g.strokeStyle=col;g.lineWidth=1.6;g.beginPath();let s0=false;
    list.forEach(o=>{const v=pick(o);if(v==null)return;
      const x=X(o.t),y=Y(v);if(!s0){g.moveTo(x,y);s0=true;}else g.lineTo(x,y);});g.stroke();};
  if(hs.length)line(o=>o.h,"#3b82f6");
  line(o=>o.c,"#f97316");
  g.textAlign="center";g.fillStyle="#7b8794";
  [t0,(t0+t1)/2,t1].forEach(tt=>{g.fillText(hmDate(tt),X(tt),h-10);});
  return c;}

    '<h2 style="'+h2+'">Acronyms &amp; References</h2>'+
    '<p>SFDA \u2013 Saudi Food and Drug Authority<br>GSDP \u2013 Good Storage and Distribution Practices<br>MKT \u2013 Mean Kinetic Temperature<br>IQ \u2013 Installation Qualification<br>PQ \u2013 Performance Qualification</p>'+
    '<p>SFDA Document PE-F-220-002-V4 \u2013 Temperature Mapping of Storage &amp; Transport<br>SFDA GSDP Guideline, Version 1.1 (2016)<br>WHO TRS 961, Annex 9 (2011)<br>PDA Technical Report No. 39 (2007)<br>EU GDP Guidelines (2013/C 343/01)</p>'+
    '<br style="page-break-after:always">';
  /* الرسمة وجدول النقاط */
  body+='<h2 style="'+h2+'">1. Overview of Storage Locations</h2>'+
    '<p>All sensors and gateways are distributed as shown \u2014 gateways as blue squares, sensors as red circles. Rooms are coloured by the mapping result: green within range, red out of range.</p>'+
    '<img src="'+plan+'" style="width:100%">'+
    '<p style="margin-top:14pt"><b>Three-dimensional view</b> \u2014 showing the height of each area and the sensor positions at three levels (UP / MID / DOWN), as required by SFDA PE-F-220-002-V4.</p>'+
    '<img src="'+iso+'" style="width:100%">'+
    '<h2 style="'+h2+'">2. Study Methodology</h2>'+
    '<p>This study was executed in accordance with <b>SFDA PE-F-220-002-V4</b> \u2014 Temperature Mapping of Storage &amp; Transport.</p>'+
    '<table style="border-collapse:collapse;width:100%"><tr><th style="'+th+'">Item</th><th style="'+th+'">Detail</th></tr>'+
    [["Required study duration","Storage areas (15\u201325 \u00B0C): 7 consecutive days \u00B7 Refrigerators (2\u20138 \u00B0C), freezers and vehicles: 24 hours"],
     ["Maximum recording interval","15 minutes"],
     ["Sensor calibration","3-point calibration (below minimum, within range, above maximum); accuracy \u00B10.5 \u00B0C or better. Calibration certificates are attached separately."],

  body+='</table><br style="page-break-after:always">';
  /* صفحة لكل غرفة */
  body+='<h2 style="'+h2+'">4. Temperature and Humidity Results by Room</h2>';
  rooms.forEach(z=>{
    const d=hmOf(z),tr=trOf(z),sx=hmStats(d,tr);

    '<h2 style="'+h2+'">8. Study Repetition</h2>'+
    '<p>The study shall be repeated if any structural modification is made to the storage areas, refrigerators or freezers, or if the air-conditioning units are changed. In all cases the study shall be repeated at least every <b>5 years</b>, even when routine readings remain within the recommended limits.</p>'+
